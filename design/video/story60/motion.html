<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Momo';src:url(https://cdn.jsdelivr.net/fontsource/fonts/momo-trust-display@5.3.0/latin-400-normal.woff2) format('woff2')}
*{box-sizing:border-box;margin:0}
html,body{width:960px;height:540px;overflow:hidden;background:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#3A3A3A}
.shot{position:absolute;inset:0;overflow:hidden;display:none}
.shot>svg{position:absolute;inset:0;width:960px;height:540px}
.abs{position:absolute}
.wm{font-family:'Momo',sans-serif}
.phone{position:absolute;width:250px;height:510px;border-radius:38px;background:#161616;padding:8px;box-shadow:0 40px 90px rgba(0,0,0,.25)}
.scr{position:relative;width:234px;height:494px;border-radius:31px;overflow:hidden;background:#fff}
.scr>.pg{position:absolute;inset:0;display:none}
.sb{height:26px;display:flex;justify-content:space-between;align-items:center;padding:0 18px;font-size:10px;font-weight:700}
.hd{height:40px;display:flex;align-items:center;padding:0 14px;gap:8px;border-bottom:1px solid #E5E5E5}
.b{font-weight:700}.g{color:#6B7280}.h{color:#9CA3AF}
.card{padding:10px 14px;border-bottom:1px solid #E5E5E5}
.tag{font-size:8px;font-weight:800;letter-spacing:.06em;padding:2px 5px;border-radius:4px}
.tf{background:#E6CFA9;color:#5C2020}.tl{background:#F5ECEC;color:#9A3F3F}
.btn{background:#3A3A3A;color:#fff;border-radius:9px;font-weight:700;text-align:center}
.fld{background:#F7F7F8;border-radius:9px;padding:9px 11px;font-size:11.5px;min-height:34px}
.av{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:8px;font-weight:700;flex:none}
.msg{position:absolute;left:10px;right:10px;height:34px;display:flex;align-items:center;gap:6px}
.bub{background:#F0F0F2;border-radius:14px;padding:6px 10px;font-size:11px;white-space:nowrap;max-width:170px;overflow:hidden;text-overflow:ellipsis}
.over{position:absolute;font-weight:800;letter-spacing:-.03em;line-height:1}
.rip{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:rgba(58,58,58,.18);display:none}
.caret{border-left:1.5px solid #3A3A3A;margin-left:1px}
.pill{background:#fff;border-radius:999px;box-shadow:0 12px 30px rgba(0,0,0,.14);display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
 <symbol id="idc" viewBox="0 0 172 108">
  <rect width="172" height="108" rx="9" fill="#fff" stroke="#D1D5DB" stroke-width="1.5"/>
  <path d="M0 9a9 9 0 0 1 9-9h154a9 9 0 0 1 9 9v19H0Z" fill="#7A1F1F"/>

  <text x="30" y="12" font-size="6.4" font-weight="800" fill="#fff" font-family="-apple-system,Segoe UI,sans-serif">POLYTECHNIC UNIVERSITY</text>

  <circle cx="33" cy="56" r="10" fill="#9CA3AF"/><path d="M17 88c2-12 9-17 16-17s14 5 16 17Z" fill="#9CA3AF"/>
  <text x="64" y="50" font-size="11" font-weight="800" fill="#3A3A3A" font-family="-apple-system,Segoe UI,sans-serif">REYES, ANA</text>
  <text x="64" y="63" font-size="7.5" fill="#6B7280" font-family="-apple-system,Segoe UI,sans-serif">BS Information Technology</text>
  <text x="64" y="80" font-size="7.5" fill="#6B7280" font-family="ui-monospace,Menlo,monospace">2023-00123-MN-0</text>
  <rect x="64" y="86" width="60" height="6" rx="2" fill="#3A3A3A" opacity=".85"/>
  <text x="140" y="96" font-size="8" font-weight="800" fill="#7A1F1F" font-family="-apple-system,Segoe UI,sans-serif">PUP</text>
 </symbol>
 <radialGradient id="vig" cx="50%" cy="50%" r="75%"><stop offset="60%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity=".18"/></radialGradient>
</defs></svg>

<div id="stage"></div>
<div id="fx" class="abs" style="inset:0;pointer-events:none"></div>

<script>
const $=id=>document.getElementById(id);
const cl=x=>Math.max(0,Math.min(1,x));
const eo=x=>{x=cl(x);return 1-Math.pow(1-x,3)};
const eio=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const eb=x=>{x=cl(x);const c=1.7,d=x-1;return 1+(c+1)*d*d*d+c*d*d};
let T=0;const P=(a,d)=>cl((T-a)/d);
const lerp=(a,b,k)=>a+(b-a)*k;
const type=(s,a,d)=>s.slice(0,Math.floor(P(a,d)*s.length));
const setT=(el,v)=>{if(typeof el==='string')el=$(el);if(el)el.setAttribute('transform',v)};

// ---------- people ----------
const EXPR={
 neutral:{bl:'M76 52 L94 51',br:'M106 51 L124 52',m:'M89 88 Q100 93 111 88',ey:4.2,mf:'none'},
 confused:{bl:'M76 50 L94 52',br:'M106 48 L124 53',m:'M91 90 Q100 88 109 91',ey:4.2,mf:'none'},
 worried:{bl:'M76 55 L94 48',br:'M106 48 L124 55',m:'M90 92 Q100 86 110 92',ey:4.6,mf:'none'},
 frustrated:{bl:'M76 49 L94 55',br:'M106 55 L124 49',m:'M90 91 L110 90',ey:2.6,mf:'none'},
 sad:{bl:'M76 55 L94 49',br:'M106 49 L124 55',m:'M91 93 Q100 88 109 93',ey:2.2,mf:'none'},
 surprised:{bl:'M76 45 Q85 40 94 45',br:'M106 45 Q115 40 124 45',m:'M95 89 a5 6 0 1 0 10 0 a5 6 0 1 0 -10 0',ey:5.4,mf:'#5B3A33'},
 curious:{bl:'M76 49 L94 50',br:'M106 45 Q115 42 124 47',m:'M92 89 Q100 91 108 88',ey:4.6,mf:'none'},
 happy:{bl:'M76 49 Q85 45 94 49',br:'M106 49 Q115 45 124 49',m:'M86 85 Q100 101 114 85 Z',ey:1.4,mf:'#5B3A33'},
 smile:{bl:'M76 50 Q85 47 94 50',br:'M106 50 Q115 47 124 50',m:'M87 86 Q100 98 113 86',ey:4.2,mf:'none'}
};
function hairSvg(style,col){
 if(style==='bob')return `<path d="M58 78 C52 30 80 18 100 18 C124 18 150 30 142 80 L138 104 C136 84 134 62 124 50 C110 56 86 56 72 46 C66 60 64 84 62 104 Z" fill="${col}"/>`;
 if(style==='bun')return `<circle cx="100" cy="18" r="15" fill="${col}"/><path d="M62 70 C58 34 82 26 100 26 C120 26 142 34 138 70 C130 50 112 44 100 44 C86 44 70 50 62 70Z" fill="${col}"/>`;
 return `<path d="M62 66 C58 32 82 22 102 22 C124 22 144 34 138 66 C132 50 118 42 100 44 C86 44 72 50 62 66Z" fill="${col}"/>`;
}
function person(id,o){
 const {skin,hair,hs,shirt,trim,pants,bag,glasses,lanyard}=o;
 const arm=(side,x)=>`<g id="${id}-arm${side}"><rect x="${x-10}" y="118" width="20" height="100" rx="10" fill="${shirt}"/><rect x="${x-9}" y="170" width="18" height="46" rx="9" fill="${skin}"/><circle cx="${x}" cy="220" r="11" fill="${skin}"/></g>`;
 return `<g id="${id}"><g id="${id}-body">
  ${bag?`<rect x="56" y="118" width="88" height="96" rx="18" fill="${bag}"/>`:''}
  <g id="${id}-legL"><rect x="80" y="226" width="26" height="140" rx="10" fill="${pants}"/><ellipse cx="90" cy="370" rx="20" ry="9" fill="#2A2A2A"/></g>
  <g id="${id}-legR"><rect x="94" y="226" width="26" height="140" rx="10" fill="${pants}"/><ellipse cx="110" cy="370" rx="20" ry="9" fill="#2A2A2A"/></g>
  ${arm('L',64)}
  <path d="M64 124 Q64 110 80 108 L120 108 Q136 110 136 124 L140 236 L60 236 Z" fill="${shirt}"/>
  <path d="M84 108 L100 126 L116 108" fill="none" stroke="${trim}" stroke-width="5" stroke-linejoin="round"/>
  ${lanyard?`<path id="${id}-lan" d="M86 110 L100 150 L114 110" fill="none" stroke="#7A1F1F" stroke-width="3"/><rect x="96" y="148" width="8" height="8" rx="2" fill="#9CA3AF"/>`:''}
  ${arm('R',136)}
  <rect x="92" y="96" width="16" height="16" fill="${skin}"/>
  <g id="${id}-head">
   
   <ellipse cx="100" cy="68" rx="37" ry="40" fill="${skin}"/>
   ${hairSvg(hs,hair)}
   <ellipse id="${id}-eyeL" cx="86" cy="66" rx="4" ry="4.2" fill="#2A2320"/>
   <ellipse id="${id}-eyeR" cx="114" cy="66" rx="4" ry="4.2" fill="#2A2320"/>
   <path id="${id}-bl" d="" stroke="${hair}" stroke-width="3.5" stroke-linecap="round" fill="none"/>
   <path id="${id}-br" d="" stroke="${hair}" stroke-width="3.5" stroke-linecap="round" fill="none"/>
   <path id="${id}-m" d="" stroke="#5B3A33" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
   <ellipse cx="80" cy="80" rx="6" ry="3.5" fill="#E08B7A" opacity=".25"/><ellipse cx="120" cy="80" rx="6" ry="3.5" fill="#E08B7A" opacity=".25"/>
   ${glasses?`<g fill="none" stroke="#3A3A3A" stroke-width="2.2"><circle cx="86" cy="66" r="10"/><circle cx="114" cy="66" r="10"/><path d="M96 66h8"/></g>`:''}
  </g>
 </g></g>`;
}
const PEOPLE={
 A:{skin:'#C98F68',hair:'#1F1A17',hs:'bob',shirt:'#FFFFFF',trim:'#7A1F1F',pants:'#34394A',bag:'#6B4E3D',lanyard:true},
 B:{skin:'#B67B55',hair:'#171412',hs:'short',shirt:'#EDEBE6',trim:'#7A1F1F',pants:'#2E3440',bag:'#3F5363'},
 S:{skin:'#C28A62',hair:'#26201C',hs:'bun',shirt:'#8E3B3B',trim:'#E6CFA9',pants:'#3A3A3A',glasses:true}
};
function pose(id,p){
 const q=Object.assign({x:0,y:0,s:1,walk:0,ph:0,armL:0,armR:0,head:0,expr:'neutral',blink:0,lean:0,flip:1},p);
 const sw=Math.sin(q.ph)*q.walk, bob=Math.abs(Math.cos(q.ph))*q.walk*.18;
 setT(id,`translate(${q.x} ${q.y-bob}) scale(${q.s*q.flip} ${q.s}) translate(-100 -380)`);
 setT(id+'-body',`rotate(${q.lean} 100 370)`);
 setT(id+'-legL',`rotate(${sw} 93 228)`);setT(id+'-legR',`rotate(${-sw} 107 228)`);
 setT(id+'-armL',`rotate(${q.armL-sw*.7} 64 124)`);setT(id+'-armR',`rotate(${q.armR+sw*.7} 136 124)`);
 setT(id+'-head',`rotate(${q.head} 100 104)`);
 const e=EXPR[q.expr];$(id+'-bl').setAttribute('d',e.bl);$(id+'-br').setAttribute('d',e.br);
 const m=$(id+'-m');m.setAttribute('d',e.m);m.setAttribute('fill',e.mf);
 const ry=q.expr==='happy'?1.4:e.ey*(1-q.blink);['eyeL','eyeR'].forEach(k=>$(id+'-'+k).setAttribute('ry',Math.max(.5,ry)));
 PS[id]=q;
}
const PS={};
function hand(id,side){ // world position of a hand
 const q=PS[id];const sx=side==='L'?64:136,sy=124;const ang=((side==='L'?q.armL:q.armR))*Math.PI/180;
 const hx=sx-96*Math.sin(ang),hy=sy+96*Math.cos(ang);
 return [q.x+(hx-100)*q.s*q.flip, q.y+(hy-380)*q.s];
}
const blink=(t,o=0)=>{const k=((t+o)%3.1);return k<.12?Math.sin(k/.12*Math.PI):0};

// ---------- sets ----------
function campus(id,variant){
 let s=`<g id="${id}-sky"><rect x="-1200" width="4800" height="540" fill="#EEF2F5"/><circle cx="1500" cy="90" r="46" fill="#F7EBD5"/></g>`;
 s+=`<g id="${id}-far">`;
 for(let i=0;i<14;i++){const x=i*180-100;s+=`<circle cx="${x}" cy="300" r="${46+(i%3)*12}" fill="#C7D3C4"/>`}
 s+=`</g><g id="${id}-bld">
  <rect x="200" y="160" width="1300" height="190" fill="#EDE6DA"/>
  <rect x="200" y="160" width="1300" height="12" fill="#7A1F1F"/>
  ${Array.from({length:26},(_,i)=>`<rect x="${226+i*49}" y="190" width="26" height="38" rx="3" fill="#CFC6B8"/><rect x="${226+i*49}" y="250" width="26" height="38" rx="3" fill="#CFC6B8"/>`).join('')}
  <rect x="780" y="60" width="140" height="290" fill="#E6DDCE"/>
  <path d="M780 60 L850 -30 L920 60Z" fill="#7A1F1F"/>
  <rect x="810" y="100" width="80" height="12" fill="#7A1F1F"/>
  ${Array.from({length:4},(_,i)=>`<rect x="${806+i*22}" y="140" width="12" height="60" rx="3" fill="#CFC6B8"/>`).join('')}
  <rect x="820" y="280" width="60" height="70" rx="4" fill="#B8AE9E"/>
  <text x="850" y="260" text-anchor="middle" font-size="13" font-weight="800" fill="#7A1F1F" font-family="-apple-system,sans-serif">MAIN BUILDING</text>
 </g>
 <g id="${id}-trees">${Array.from({length:10},(_,i)=>{const x=i*260+40;return `<rect x="${x-6}" y="300" width="12" height="70" fill="#8B7B6B"/><circle cx="${x}" cy="290" r="44" fill="#A9BBA5"/><circle cx="${x+26}" cy="310" r="30" fill="#98AE94"/>`}).join('')}</g>
 <rect x="-1200" y="360" width="4800" height="180" fill="#E4DFD6"/>
 <path d="M-1200 400 L3600 400 L3600 470 L-1200 470Z" fill="#D8D1C5"/>
 ${Array.from({length:20},(_,i)=>`<rect x="${i*130}" y="433" width="60" height="4" rx="2" fill="#CCC4B6"/>`).join('')}
 <g id="${id}-crowd"></g>`;
 return s;
}
function ghost(x,y,s,c){return `<g transform="translate(${x} ${y}) scale(${s})"><rect x="-16" y="-70" width="32" height="56" rx="14" fill="${c}"/><circle cx="0" cy="-86" r="15" fill="${c}"/><rect x="-13" y="-18" width="11" height="44" rx="5" fill="${c}"/><rect x="2" y="-18" width="11" height="44" rx="5" fill="${c}"/></g>`}

// ---------- phone UI ----------
const statusBar=`<div class="sb"><span>9:41</span><span style="display:flex;gap:4px;align-items:center"><span style="width:14px;height:7px;border:1.3px solid #3A3A3A;border-radius:2px;display:inline-block"></span></span></div>`;
const ICO={pin:'<path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12Z"/><circle cx="12" cy="10" r="2.5"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',cam:'<path d="M4 8h3l2-3h6l2 3h3v11H4Z"/><circle cx="12" cy="13" r="3.5"/>',check:'<path d="M5 12.5 10 17.5 19 7"/>',back:'<path d="m15 18-6-6 6-6"/>',up:'<path d="M12 4 3 19h18L12 4Z"/>',chat:'<path d="M21 12a8 8 0 0 1-12 7l-5 1 1-4a8 8 0 1 1 16-4Z"/>',bell:'<path d="M18 16V11a6 6 0 0 0-12 0v5l-2 2h16ZM10 21h4"/>',plus:'<path d="M12 5v14M5 12h14"/>',shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/>'};
const ic=(k,s=14,c='currentColor',w=2)=>`<svg viewBox="0 0 24 24" style="width:${s}px;height:${s}px;fill:none;stroke:${c};stroke-width:${w};stroke-linecap:round;stroke-linejoin:round;flex:none">${ICO[k]}</svg>`;
const wmS=(fs)=>`<span class="wm" style="font-size:${fs}px"><span style="color:#9A3F3F">Found</span><span style="color:#C1856D">it</span></span>`;
const idThumb=(w)=>`<svg viewBox="0 0 172 108" style="width:${w}px;height:${w*108/172}px;display:block"><use href="#idc"/></svg>`;
function feedCard(o){return `<div class="card" ${o.id?`id="${o.id}"`:''}><div style="display:flex;align-items:center;gap:6px;font-size:10px"><span class="av" style="background:${o.c}">${o.ini}</span><span class="b">${o.name}</span><span class="h">${o.time}</span><span class="tag ${o.k==='FOUND'?'tf':'tl'}">${o.k}</span></div><div class="b" style="font-size:13px;margin:6px 0 4px">${o.title}</div><div class="g" style="font-size:10px;display:flex;gap:4px;align-items:center">${ic('pin',11)}${o.loc}</div>${o.img?`<div style="margin-top:7px;border-radius:9px;overflow:hidden;background:#F2F2F2;height:${o.ih||70}px;display:flex;align-items:center;justify-content:center">${o.img}</div>`:''}<div class="h" style="display:flex;gap:14px;margin-top:7px;font-size:10px;align-items:center">${ic('up',12)}${o.up||0} ${ic('chat',12)}0</div></div>`}
const feedHeader=`<div class="hd" style="justify-content:space-between">${wmS(19)}<span style="display:flex;gap:10px;align-items:center" class="g">${ic('search',15)}<span id="%ID%-post" class="btn" style="padding:5px 9px;font-size:10.5px;display:flex;gap:3px;align-items:center">${ic('plus',11,'#fff',2.6)}Post</span></span></div>`;
const oldCards=feedCard({c:'#6B7280',ini:'LC',name:'Lito Cruz',time:'3h',k:'FOUND',title:'Black wallet near the Oval',loc:'Oval',img:`<div style="width:46px;height:34px;border-radius:6px;background:#3A3A3A"></div>`,ih:60,up:4})+feedCard({c:'#9A3F3F',ini:'MS',name:'Mia Santos',time:'5h',k:'LOST',title:'Blue tumbler at the Library',loc:'Library',up:2})+feedCard({c:'#4B5563',ini:'JD',name:'Jomar D.',time:'6h',k:'FOUND',title:'Keys with red lanyard',loc:'Gym',up:1});

function makePhone(parent,id,pages){
 const d=document.createElement('div');d.className='phone';d.id=id;
 d.innerHTML=`<div class="scr" id="${id}-scr">${Object.entries(pages).map(([k,v])=>`<div class="pg" id="${id}-${k}">${statusBar}${v.replaceAll('%ID%',id)}</div>`).join('')}<div class="rip" id="${id}-rip"></div></div>`;
 parent.appendChild(d);return d;
}
function page(id,k){document.querySelectorAll(`#${id}-scr>.pg`).forEach(e=>e.style.display=e.id===`${id}-${k}`?'block':'none')}
function tap(id,x,y,a){const r=$(id+'-rip');const k=P(a,.45);if(k>0&&k<1){r.style.display='block';r.style.left=x+'px';r.style.top=y+'px';r.style.transform=`scale(${.4+k*1.3})`;r.style.opacity=1-k;return true}return false}
function tapAny(id,list){const r=$(id+'-rip');for(const [x,y,a] of list){if(tap(id,x,y,a))return}r.style.display='none'}

// ---------- build shots ----------
const stage=$('stage');
function shot(id,html){const d=document.createElement('div');d.className='shot';d.id=id;d.innerHTML=html;stage.appendChild(d);return d}

// S1 campus walk + look around (0-5)
shot('s1',`<svg viewBox="0 0 960 540"><g id="c1">${campus('k1')}<g id="k1-people">${ghost(300,420,1,'#CDD2D8')}${ghost(1250,430,1.05,'#CDD2D8')}${ghost(1700,425,.95,'#D3D7DC')}</g>${person('A1',PEOPLE.A)}</g><rect width="960" height="540" fill="url(#vig)"/></svg>`);
// S2 close-up chest, empty lanyard
shot('s2',`<svg viewBox="0 0 960 540"><rect width="960" height="540" fill="#E9ECEF"/><g id="c2"><g transform="translate(480 250) scale(3) translate(-100 -140)">
 <path d="M40 124 Q40 104 70 100 L130 100 Q160 104 160 124 L170 260 L30 260 Z" fill="#fff"/>
 <path d="M80 100 L100 124 L120 100" fill="none" stroke="#7A1F1F" stroke-width="5" stroke-linejoin="round"/>
 <path d="M86 102 L100 150 L114 102" fill="none" stroke="#7A1F1F" stroke-width="3.2"/>
 <g id="clip2"><rect x="95" y="148" width="10" height="10" rx="2" fill="#9CA3AF"/><path d="M97 158 v8 M103 158 v8" stroke="#9CA3AF" stroke-width="2"/></g>
 <path id="dash2" d="M86 170 h28 v42 h-28 Z" fill="none" stroke="#9CA3AF" stroke-width="1.4" stroke-dasharray="4 3"/>
 </g><g id="hand2" transform="translate(0 0)"><rect x="0" y="0" width="120" height="70" rx="34" fill="#C98F68"/><rect x="92" y="-12" width="30" height="48" rx="15" fill="#C98F68"/></g></g><rect width="960" height="540" fill="url(#vig)"/></svg>`);
// S3 backpack top-down
shot('s3',`<svg viewBox="0 0 960 540"><rect width="960" height="540" fill="#DAD4CA"/><g id="c3">
 <rect x="250" y="70" width="460" height="420" rx="60" fill="#6B4E3D"/><rect x="290" y="110" width="380" height="340" rx="40" fill="#3E2D24"/>
 <g id="b3a"><rect x="330" y="170" width="150" height="200" rx="8" fill="#E5E7EB"/><rect x="345" y="190" width="120" height="8" rx="4" fill="#C9CDD3"/><rect x="345" y="208" width="90" height="8" rx="4" fill="#C9CDD3"/></g>
 <g id="b3b"><rect x="500" y="150" width="54" height="230" rx="24" fill="#5E7C94"/><rect x="505" y="140" width="44" height="26" rx="8" fill="#465E70"/></g>
 <g id="b3c"><rect x="580" y="200" width="20" height="160" rx="6" fill="#E6CFA9" transform="rotate(12 590 280)"/></g>
 <g id="b3d"><rect x="360" y="330" width="120" height="70" rx="10" fill="#2F2A27"/></g>
 <g id="hand3"><rect x="-60" y="-40" width="120" height="80" rx="38" fill="#C98F68"/><rect x="40" y="-60" width="30" height="50" rx="15" fill="#C98F68"/></g>
</g><rect width="960" height="540" fill="url(#vig)"/></svg>`);
// S4 face close-up looking around
